<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#0a1220"/><style>text{font-family:Arial,sans-serif;fill:#f4f7fb}.h{font-size:32px;font-weight:700}.t{font-size:20px}.box{fill:#111d32;stroke:#294464;stroke-width:2}</style><text class="h" x="45" y="55">90-second evidence demo storyboard</text><rect class="box" x="45" y="100" rx="14" width="275" height="250"/><text class="t" x="65" y="135">0-9s</text><text class="h" x="65" y="180">PUBLIC SOURCE PREVIEW</text><text class="t" x="65" y="225">• CLONE PUBLIC REPOSITORY</text><text class="t" x="65" y="260">• NPM PACKAGE NOT PUBLISHED</text><text class="t" x="65" y="295">• NO HOSTED SERVICE REQUIRED</text><rect class="box" x="350" y="100" rx="14" width="275" height="250"/><text class="t" x="370" y="135">9-18s</text><text class="h" x="370" y="180">INSTALL SAFELY</text><text class="t" x="370" y="225">• NPM CI --IGNORE-SCRIPTS</text><text class="t" x="370" y="260">• DEPENDENCY LIFECYCLE DISABLED</text><text class="t" x="370" y="295">• SOURCE TREE REMAINS LOCAL</text><rect class="box" x="655" y="100" rx="14" width="275" height="250"/><text class="t" x="675" y="135">18-27s</text><text class="h" x="675" y="180">BUILD AND INSPECT</text><text class="t" x="675" y="225">• TYPECHECK PASS</text><text class="t" x="675" y="260">• BUILD PASS</text><text class="t" x="675" y="295">• CLI HELP PASS</text><rect class="box" x="960" y="100" rx="14" width="275" height="250"/><text class="t" x="980" y="135">27-36s</text><text class="h" x="980" y="180">BOUND WORKSPACE</text><text class="t" x="980" y="225">• DISPOSABLE PUBLIC FIXTURE</text><text class="t" x="980" y="260">• READ README INSIDE ROOT</text><text class="t" x="980" y="295">• ONE REVIEWABLE FILE CHANGE</text><rect class="box" x="1265" y="100" rx="14" width="275" height="250"/><text class="t" x="1285" y="135">36-45s</text><text class="h" x="1285" y="180">REVIEW THE DIFF</text><text class="t" x="1285" y="225">• CHANGED FILE README.MD</text><text class="t" x="1285" y="260">• UNIFIED DIFF CAPTURED</text><text class="t" x="1285" y="295">• NO HIDDEN SIDE EFFECT</text><rect class="box" x="45" y="400" rx="14" width="275" height="250"/><text class="t" x="65" y="435">45-54s</text><text class="h" x="65" y="480">REAL REFUSAL</text><text class="t" x="65" y="525">• DOT ENV DENIED</text><text class="t" x="65" y="560">• PARENT ESCAPE DENIED</text><text class="t" x="65" y="595">• SYMLINK ESCAPE DENIED</text><rect class="box" x="350" y="400" rx="14" width="275" height="250"/><text class="t" x="370" y="435">54-63s</text><text class="h" x="370" y="480">SECURITY CONTROL SMOKE</text><text class="t" x="370" y="525">• PAYLOAD TAMPER DENIED</text><text class="t" x="370" y="560">• CREDENTIAL URL DENIED</text><text class="t" x="370" y="595">• CLEAN HTTPS ORIGIN ALLOWED</text><rect class="box" x="655" y="400" rx="14" width="275" height="250"/><text class="t" x="675" y="435">63-72s</text><text class="h" x="675" y="480">EVIDENCE BEFORE CLAIMS</text><text class="t" x="675" y="525">• VALIDATION RESULT RECORDED</text><text class="t" x="675" y="560">• CHANGED FILES RECORDED</text><text class="t" x="675" y="595">• UNVERIFIED WORK STAYS VISIBLE</text><rect class="box" x="960" y="400" rx="14" width="275" height="250"/><text class="t" x="980" y="435">72-81s</text><text class="h" x="980" y="480">HUMAN REVIEW GATE</text><text class="t" x="980" y="525">• NO GIT REMOTE IN FIXTURE</text><text class="t" x="980" y="560">• NO AUTOMATIC PUSH</text><text class="t" x="980" y="595">• NO AUTOMATIC DEPLOY</text><rect class="box" x="1265" y="400" rx="14" width="275" height="250"/><text class="t" x="1285" y="435">81-90s</text><text class="h" x="1285" y="480">MAINTAINER DECIDES</text><text class="t" x="1285" y="525">• REVIEW DIFF AND TESTS</text><text class="t" x="1285" y="560">• DECIDE COMMIT MERGE RELEASE</text><text class="t" x="1285" y="595">• CODEXPRO IS NOT OPENAI</text></svg>