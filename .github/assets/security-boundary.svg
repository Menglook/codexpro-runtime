<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#0a1220"/><style>text{font-family:Arial,sans-serif;fill:#f4f7fb}.h{font-size:30px;font-weight:700}.s{font-size:18px}.box{fill:#111d32;stroke-width:3}.g{stroke:#35d07f}.c{stroke:#56b6f7}.y{stroke:#f5c451}.r{stroke:#ff6b6b}</style><text class="h" x="50" y="55">Security boundary and review gate</text><rect class="box g" x="70" y="120" rx="18" width="470" height="105"/><text class="h" x="110" y="170">1. Authenticated transport</text><text class="s" x="110" y="200">public or non-loopback HTTP fails closed</text><rect class="box c" x="660" y="120" rx="18" width="470" height="105"/><text class="h" x="700" y="170">2. Allowed root</text><text class="s" x="700" y="200">traversal, blocked paths, symlinks denied</text><rect class="box y" x="70" y="280" rx="18" width="470" height="105"/><text class="h" x="110" y="330">3. Tool policy</text><text class="s" x="110" y="360">read, write, Bash, Git, browser capabilities</text><rect class="box r" x="660" y="280" rx="18" width="470" height="105"/><text class="h" x="700" y="330">4. Evidence and refusal</text><text class="s" x="700" y="360">failed checks remain visible and reviewable</text><rect class="box g" x="365" y="445" rx="18" width="470" height="105"/><text class="h" x="435" y="495">5. Human review gate</text><text class="s" x="440" y="525">external effects require explicit approval</text></svg>