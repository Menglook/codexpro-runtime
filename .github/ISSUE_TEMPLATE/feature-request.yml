name: Feature request
description: Propose a bounded capability or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the public maintainer problem before proposing an implementation. Roadmap items are directional and do not promise release dates.

  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What concrete public-source workflow is difficult or unsafe today?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Public use case
      description: Give a reproducible scenario without private repositories, customer data, production identity, or credentials.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed scope
      description: Describe the smallest useful behavior and likely public areas affected.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true

  - type: dropdown
    id: side_effect
    attributes:
      label: Highest side-effect level proposed
      options:
        - No side effects or documentation only
        - Read-only local access
        - Workspace file write
        - Local command execution
        - Network read
        - External write or Git operation
        - Unknown
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and public-boundary impact
      description: Explain new authority, data exposure, failure-closed behavior, and anything that must remain private.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Which focused checks and negative cases would prove the change?
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Project-boundary confirmation
      options:
        - label: This request does not depend on publishing credentials, customer data, private integrations, or production identity.
          required: true
        - label: I understand acceptance does not promise an npm package, release date, hosted service, or automatic merge.
          required: true
